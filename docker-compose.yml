services:
  frontend:
    build:
      context: ./frontend
    container_name: todo-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run host-dev

  backend-express:
    profiles:
      - node
    build:
      context: ./backend-express
    container_name: todo-backend-express
    ports:
      - "3030:3030"
    volumes:
      - ./database:/database

  backend-rails:
    profiles:
      - rails
    build:
      context: ./backend-rails
    container_name: todo-backend-rails
    ports:
      - "3030:3000"
    volumes:
      - ./database:/database
    environment:
      RAILS_ENV: development
    command: bin/rails server -b 0.0.0.0

  backend-fastapi:
    profiles:
      - fastapi
    build:
      context: ./backend-fastapi
    container_name: todo-backend-fastapi
    ports:
      - "3030:3000"
    volumes:
      - ./database:/database
    environment:
      DATABASE_PATH: /database/todos.db
